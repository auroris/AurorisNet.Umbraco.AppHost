name: CI

# Tests each pull request on the Umbraco release that Directory.Packages.props pins, and merges a Dependabot update that
# passes. An update of a package the library references ships in the next weekly release.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Test
    runs-on: windows-latest
    # In three processes on a developer's machine, all the tests take about six minutes and a Dependabot update's
    # about two and a half.
    timeout-minutes: 60
    env:
      # AppBlocks comes from the submodule. Restore the other libraries from NuGet.
      UseBreakGlassSource: 'false'
      UseIdentityServerSsoSource: 'false'
      UseIdentityServerDirectorySource: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch AppBlocks main
        run: |
          git submodule update --init --remote --depth 1 -- AppBlocks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C AppBlocks log -1 --format="AppBlocks main at %H" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # The library's build runs the Frontend build, which needs Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      # A Dependabot update changes package versions only, so its run leaves out the tests that each install a site of
      # their own. The installs the other tests share still take the new versions through an install and a first-boot
      # import. Every other run takes all the tests, as each release does.
      - name: Test
        env:
          DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          $exclude = if ($env:DEPENDABOT -eq 'true') { 'Category=OwnInstall' } else { @() }
          ./tests/test-parallel.ps1 -Shards 3 -ExcludeTrait $exclude

      - name: Pack
        run: |
          foreach ($project in 'src/UmbracoAppHost', 'tests/UmbracoAppHost.Testing') {
            dotnet pack $project -c Release -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { throw "Could not pack $project." }
          }
          $package = (Get-Item artifacts/packages/AurorisNet.Umbraco.AppHost.[0-9]*.nupkg).FullName
          ./Migrations/Tests/Test-Package.ps1 $package
          ./Migrations/Tests/Test-PackageInstall.ps1 $package

  # A workflow that runs for Dependabot gets a read-only token unless the job asks for more.
  dependabot:
    name: Merge Dependabot update
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The shared action records shipped NuGet updates. Submodule pointer updates also trigger a weekly release.
      - name: Merge an AppBlocks pointer update and record it for the weekly release
        id: appblocks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $files = @(gh pr diff $env:PR_NUMBER --name-only)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($files.Count -eq 1 -and $files[0] -ceq 'AppBlocks') {
            $body = Join-Path $env:RUNNER_TEMP 'appblocks-release-note.txt'
            "Release-Bump: patch`nRelease-Note: Updates bundled AppBlocks." | Set-Content $body
            gh pr merge $env:PR_NUMBER --squash --delete-branch --body-file $body
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            'merged=true' >> $env:GITHUB_OUTPUT
          }
      - uses: auroris/AurorisNet.Build/actions/dependabot-release@main
        if: steps.appblocks.outputs.merged != 'true'
        with:
          shipped-projects: |
            src/UmbracoAppHost
            tests/UmbracoAppHost.Testing
